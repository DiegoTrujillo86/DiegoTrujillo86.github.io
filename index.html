<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anatomía Humana DG</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- VARIABLES DE COLOR Y ESTILO --- */
        :root {
            --bg-principal: #050505;
            --bg-paneles: rgba(20, 20, 25, 0.8);
            --bg-lienzo: #000000;
            --acento-cyan: #00f0ff;
            --acento-cyan-hover: #00c3ff;
            --acento-rojo: #ff2a5f;
            --texto-principal: #e0e6ed;
            --texto-secundario: #8b9eb0;
            --borde-panel: rgba(0, 240, 255, 0.2);
        }

        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-principal);
            background-image: radial-gradient(circle at 50% 0%, #1a2430 0%, transparent 70%);
            color: var(--texto-principal);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            text-align: center;
            color: var(--acento-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            animation: fadeInDown 1s ease-out;
        }

        p {
            color: var(--texto-secundario);
            margin-bottom: 40px;
            text-align: center;
            max-width: 650px;
            font-weight: 300;
            animation: fadeIn 1.5s ease-out;
        }

        /* --- ANIMACIONES GLOBALES --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }
            50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); }
            100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .contenedor-principal {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1300px;
            animation: slideUp 1s ease-out;
        }

        /* --- PANELES LATERALES --- */
        .menu-izquierdo, .herramientas {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--bg-paneles);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--borde-panel);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            transition: transform 0.3s ease;
            box-sizing: border-box;
        }
        
        .menu-izquierdo { width: 350px; }
        .herramientas { min-width: 280px; flex: 1; }

        .menu-izquierdo:hover, .herramientas:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 240, 255, 0.4);
        }

        .titulo-herramientas {
            font-size: 1.2rem;
            color: var(--acento-cyan);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- CONTROLES Y FORMULARIOS --- */
        .control-grupo {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.9rem;
            color: var(--texto-secundario);
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--texto-principal);
            border: 1px solid #334155;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        select:focus {
            border-color: var(--acento-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* --- IMÁGENES Y MARCADORES --- */
        .contenedor-imagen-menu {
            position: relative;
            width: 100%;
            display: none; 
            border-radius: 10px;
            background: var(--bg-lienzo);
            border: 1px solid #334155;
            overflow: hidden;
        }

        .img-detalle-zona {
            display: block;
            width: 100%;
            height: auto;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .img-detalle-zona:hover { opacity: 1; }

        .marcador-parte {
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: var(--acento-rojo);
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--acento-rojo);
            animation: latidoElegante 1.5s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes latidoElegante {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 95, 0.7); transform: translate(-50%, -50%) scale(0.95); }
            70% { box-shadow: 0 0 0 15px rgba(255, 42, 95, 0); transform: translate(-50%, -50%) scale(1); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 95, 0); transform: translate(-50%, -50%) scale(0.95); }
        }

        /* --- PANEL DE INFORMACIÓN --- */
        .panel-info {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--acento-cyan);
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            color: #c9d1d9;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .panel-info strong {
            color: var(--acento-cyan);
            font-size: 1.1rem;
            display: block;
            margin-bottom: 8px;
        }

        .animar-entrada {
            animation: slideUp 0.4s ease-out forwards;
        }

        /* --- VISOR PRINCIPAL (BORRADOR) --- */
        .visor-anatomia {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex: 1;
        }

        .contenedor-lienzo {
            position: relative;
            width: 400px;
            height: 750px;
            background: var(--bg-lienzo);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.2);
            animation: glowPulse 4s infinite;
            /* touch-action previene comportamientos de scroll por defecto en el área de dibujo */
            touch-action: none;
        }

        .capa-anatomia {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; 
            transition: opacity 0.5s ease;
        }

        .capa-activa {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* --- SELECTORES DE CAPA (RADIO BUTTONS) --- */
        .selector-capa {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }

        .radio-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 1px solid #334155;
            transition: all 0.3s;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .radio-btn:hover { 
            background: rgba(0, 240, 255, 0.05); 
            border-color: rgba(0, 240, 255, 0.5);
        }

        .radio-btn input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #5e6c7c;
            border-radius: 50%;
            outline: none;
            transition: 0.3s;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .radio-btn input[type="radio"]:checked {
            border-color: var(--acento-cyan);
            box-shadow: 0 0 10px var(--acento-cyan);
        }

        .radio-btn input[type="radio"]:checked::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--acento-cyan);
            border-radius: 50%;
        }

        /* --- BOTONES --- */
        button.btn-restaurar {
            padding: 15px;
            background: linear-gradient(135deg, #ff2a5f, #c21841);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 42, 95, 0.3);
            width: 100%;
        }

        button.btn-restaurar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 42, 95, 0.5);
            background: linear-gradient(135deg, #ff3b6d, #d91d4d);
        }

        button.btn-restaurar:active {
            transform: translateY(1px);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--acento-cyan); }

        /* =========================================
           RESPONSIVIDAD (OPTIMIZACIÓN MÓVIL)
           ========================================= */
        @media (max-width: 950px) {
            body {
                padding: 15px 10px;
            }
            
            h1 {
                font-size: 1.6rem;
                line-height: 1.2;
            }
            
            p {
                font-size: 0.9rem;
                margin-bottom: 25px;
            }

            .contenedor-principal { 
                flex-direction: column; 
                align-items: center; 
                gap: 20px;
            }
            
            .visor-anatomia { 
                flex-direction: column; 
                width: 100%; 
                align-items: center; 
                gap: 20px;
            }
            
            .menu-izquierdo, .herramientas { 
                width: 100%; 
                padding: 20px 15px;
            }
            
            /* Ajuste del lienzo para pantallas móviles */
            .contenedor-lienzo { 
                width: 100%; 
                max-width: 450px; 
                height: 550px; /* Altura controlada para no ocupar toda la pantalla y permitir hacer scroll */
            }

            /* Efecto hover desactivado para evitar "atascos" táctiles */
            .menu-izquierdo:hover, .herramientas:hover {
                transform: none;
            }
            
            .radio-btn {
                padding: 12px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <h1>Anatomia Humana DG</h1>

    <div class="contenedor-principal">

        <div class="menu-izquierdo">
            <div class="titulo-herramientas">Explorador de Sistemas</div>
            
            <div class="control-grupo">
                <label>1. Selecciona un Sistema:</label>
                <select id="select-sistema" onchange="actualizarSistema()">
                    <option value="">-- Elige un sistema --</option>
                    <option value="esqueleto">Sistema Óseo (Esqueleto)</option>
                    <option value="musculos">Sistema Muscular</option>
                    <option value="nervioso">Sistema Nervioso</option>
                    <option value="organos">Órganos Internos</option>
                </select>
            </div>

            <div id="contenedor-img-zona" class="contenedor-imagen-menu">
                <img id="img-zona" class="img-detalle-zona" src="" alt="Detalle del sistema">
            </div>

            <div class="control-grupo" id="contenedor-subpartes" style="display: none;">
                <label>2. Conoce sus partes:</label>
                <select id="select-subparte" onchange="actualizarInfoSubparte()">
                </select>
            </div>

            <div id="panel-info" class="panel-info"></div>
        </div>

        <div class="visor-anatomia">
            
            <div class="contenedor-lienzo">
                <img src="esqueleto.png" class="capa-anatomia" style="z-index: 1;" alt="Esqueleto base">
                
                <canvas id="canvas-nervioso" class="capa-anatomia" style="z-index: 2;"></canvas>
                <canvas id="canvas-organos" class="capa-anatomia" style="z-index: 3;"></canvas>
                <canvas id="canvas-musculos" class="capa-anatomia capa-activa" style="z-index: 4;"></canvas>
            </div>

            <div class="herramientas">
                <div class="titulo-herramientas">Herramienta de Disección</div>
                
                <div class="control-grupo">
                    <label>¿Qué capa deseas borrar (descubrir)?</label>
                    <div class="selector-capa">
                        <label class="radio-btn">
                            <input type="radio" name="capaSelect" value="canvas-musculos" checked onchange="cambiarCapaActiva()">
                            Músculos (Capa Exterior)
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="capaSelect" value="canvas-organos" onchange="cambiarCapaActiva()">
                            Órganos Internos
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="capaSelect" value="canvas-nervioso" onchange="cambiarCapaActiva()">
                            Sistema Nervioso
                        </label>
                    </div>
                </div>

                <button class="btn-restaurar" onclick="inicializarLienzos()">🔄 Restaurar Capas</button>
            </div>
        </div>

    </div>

    <script>
        /* =========================================
           BASE DE DATOS ANATÓMICA
           ========================================= */
        const datosSistemas = {
            "esqueleto": {
                imagen: "esqueleto.png", 
                infoGeneral: "El sistema óseo adulto está compuesto por 206 huesos. Actúa como el armazón del cuerpo, proporciona soporte estructural, protege los órganos vitales, ancla los músculos y produce células sanguíneas en la médula ósea.",
                partes: [
                    { id: "craneo", nombre: "Cráneo", info: "Estructura ósea que protege el encéfalo. Consta de 22 huesos firmemente unidos, excepto la mandíbula que es móvil para permitir la masticación y el habla.", coords: [{x: 50, y: 10}] },
                    { id: "mandibula", nombre: "Mandíbula", info: "El hueso más grande y fuerte de la cara. Es el único hueso móvil del cráneo y sostiene los dientes inferiores.", coords: [{x: 50, y: 14}] },
                    { id: "clavicula", nombre: "Clavícula", info: "Hueso largo en forma de 'S' que actúa como un puntal entre el omóplato y el esternón, manteniendo el brazo alejado del tórax.", coords: [{x: 35, y: 20}, {x: 65, y: 20}] },
                    { id: "esternon", nombre: "Esternón", info: "Hueso plano situado en el centro del pecho. Las costillas se conectan a él mediante cartílago, formando la caja torácica.", coords: [{x: 50, y: 26}] },
                    { id: "costillas", nombre: "Costillas", info: "Doce pares de huesos curvos que forman una jaula protectora para órganos vitales como el corazón y los pulmones.", coords: [{x: 40, y: 28}, {x: 60, y: 28}] },
                    { id: "columna", nombre: "Columna Vertebral", info: "Formada por 33 vértebras (algunas fusionadas). Protege la médula espinal y permite mantener el tronco erguido y flexible.", coords: [{x: 50, y: 35}] },
                    { id: "pelvis", nombre: "Pelvis", info: "Estructura en forma de anillo que soporta el peso del cuerpo y lo transmite a las extremidades inferiores. Protege órganos digestivos y reproductores.", coords: [{x: 50, y: 48}] },
                    { id: "humero", nombre: "Húmero (Brazo)", info: "El hueso más largo de la extremidad superior. Se articula con la escápula en el hombro y con el radio y cúbito en el codo.", coords: [{x: 25, y: 32}, {x: 75, y: 32}] },
                    { id: "antebrazo", nombre: "Radio y Cúbito (Antebrazo)", info: "Dos huesos paralelos. El radio está del lado del pulgar y permite girar la mano. El cúbito es más largo y forma la punta del codo.", coords: [{x: 20, y: 42}, {x: 80, y: 42}] },
                    { id: "manos", nombre: "Huesos de la Mano", info: "Cada mano tiene 27 huesos: 8 carpianos en la muñeca, 5 metacarpianos en la palma y 14 falanges en los dedos.", coords: [{x: 15, y: 53}, {x: 85, y: 53}] },
                    { id: "femur", nombre: "Fémur (Muslo)", info: "El hueso más largo, fuerte y pesado del cuerpo humano. Soporta gran parte del peso corporal al estar de pie o caminar.", coords: [{x: 44, y: 65}, {x: 56, y: 65}] },
                    { id: "rotula", nombre: "Rótula (Rodilla)", info: "Hueso sesamoideo grueso y triangular que se articula con el fémur y protege la parte frontal de la articulación de la rodilla.", coords: [{x: 44, y: 75}, {x: 56, y: 75}] },
                    { id: "pierna", nombre: "Tibia y Peroné (Pierna)", info: "La tibia es el hueso principal que soporta el peso en la espinilla. El peroné es más delgado y sirve principalmente para la inserción muscular.", coords: [{x: 44, y: 85}, {x: 56, y: 85}] },
                    { id: "pies", nombre: "Huesos del Pie", info: "Estructura compleja de 26 huesos (tarsianos, metatarsianos y falanges) diseñados para soportar el peso y actuar como palanca al caminar.", coords: [{x: 45, y: 95}, {x: 55, y: 95}] }
                ]
            },
            "musculos": {
                imagen: "musculos.png",
                infoGeneral: "El sistema muscular cuenta con más de 600 músculos esqueléticos. Trabajan en pares para contraerse y relajarse, permitiendo todo tipo de movimientos, desde parpadear hasta correr.",
                partes: [
                    { id: "frontal", nombre: "Músculo Frontal", info: "Ubicado en la frente, es responsable de levantar las cejas y arrugar la frente, clave en la expresión facial de sorpresa.", coords: [{x: 50, y: 7}] },
                    { id: "esternocleidomastoideo", nombre: "Esternocleidomastoideo", info: "Músculo del cuello que permite la rotación de la cabeza hacia los lados y su flexión hacia adelante.", coords: [{x: 45, y: 16}, {x: 55, y: 16}] },
                    { id: "trapecio", nombre: "Trapecio", info: "Músculo grande y triangular en la parte superior de la espalda y el cuello. Ayuda a mover, rotar y estabilizar los omóplatos (escápulas).", coords: [{x: 38, y: 20}, {x: 62, y: 20}] },
                    { id: "deltoides", nombre: "Deltoides (Hombros)", info: "El músculo que forma el contorno redondeado del hombro. Es el principal responsable de la elevación del brazo.", coords: [{x: 32, y: 24}, {x: 68, y: 24}] },
                    { id: "pectorales", nombre: "Pectorales", info: "Músculos grandes del pecho. Tiran del brazo hacia el cuerpo y son fundamentales en movimientos como empujar o abrazar.", coords: [{x: 42, y: 26}, {x: 58, y: 26}] },
                    { id: "biceps", nombre: "Bíceps Braquial", info: "Músculo en la parte frontal del brazo. Su función principal es flexionar el codo, acercando el antebrazo al hombro.", coords: [{x: 28, y: 32}, {x: 72, y: 32}] },
                    { id: "triceps", nombre: "Tríceps Braquial", info: "Ubicado en la parte posterior del brazo. Es el antagonista del bíceps, encargado de extender o estirar el codo.", coords: [{x: 24, y: 32}, {x: 76, y: 32}] },
                    { id: "abdominales", nombre: "Recto Abdominal", info: "Conocido comúnmente como 'cuadritos'. Flexiona la columna vertebral, protege los órganos abdominales y ayuda en la respiración.", coords: [{x: 50, y: 38}] },
                    { id: "oblicuos", nombre: "Oblicuos", info: "Músculos a los lados del abdomen que permiten la rotación y la flexión lateral del tronco.", coords: [{x: 42, y: 40}, {x: 58, y: 40}] },
                    { id: "gluteos", nombre: "Glúteo Mayor", info: "El músculo más grande y poderoso del cuerpo. Extiende la cadera, fundamental para levantarse de una silla, correr o subir escaleras.", coords: [{x: 45, y: 52}, {x: 55, y: 52}] },
                    { id: "cuadriceps", nombre: "Cuádriceps", info: "Grupo de cuatro potentes músculos en la parte frontal del muslo. Son los extensores más fuertes de la articulación de la rodilla.", coords: [{x: 43, y: 65}, {x: 57, y: 65}] },
                    { id: "isquiotibiales", nombre: "Isquiotibiales", info: "Músculos en la parte posterior del muslo. Doblan la rodilla y extienden la cadera, trabajando en conjunto con los cuádriceps.", coords: [{x: 40, y: 68}, {x: 60, y: 68}] },
                    { id: "gemelos", nombre: "Gemelos (Gastrocnemio)", info: "Músculo prominente de la pantorrilla. Es vital para caminar, correr y saltar, ya que empuja el pie hacia abajo (plantiflexión).", coords: [{x: 43, y: 85}, {x: 57, y: 85}] },
                    { id: "aquiles", nombre: "Tendón de Aquiles", info: "El tendón más grueso y fuerte del cuerpo humano. Conecta los músculos de la pantorrilla con el hueso del talón.", coords: [{x: 44, y: 92}, {x: 56, y: 92}] }
                ]
            },
            "nervioso": {
                imagen: "nervioso.png",
                infoGeneral: "El sistema nervioso coordina todas las acciones voluntarias e involuntarias. Transmite señales eléctricas increíblemente rápidas entre el cerebro y el resto del cuerpo.",

                    { id: "cerebelo", nombre: "Cerebelo", info: "Ubicado en la parte posterior e inferior del cráneo. Regula el equilibrio, la postura y coordina los movimientos musculares finos.", coords: [{x: 50, y: 12}] },
                    { id: "tronco", nombre: "Tronco Encefálico", info: "Conecta el cerebro con la médula espinal. Controla funciones vitales automáticas como la respiración, el ritmo cardíaco y la digestión.", coords: [{x: 50, y: 15}] },
                    { id: "medula", nombre: "Médula Espinal", info: "Un grueso cordón de tejido nervioso que baja por el centro de la columna. Conecta el cerebro con los nervios de casi todo el cuerpo.", coords: [{x: 50, y: 35}] },
                    { id: "plexo_braquial", nombre: "Plexo Braquial", info: "Una red de nervios que se forma en el cuello y hombro. De aquí nacen todos los nervios que van hacia el brazo y la mano.", coords: [{x: 35, y: 22}, {x: 65, y: 22}] },
                    { id: "nervio_radial", nombre: "Nervio Radial", info: "Recorre el brazo y permite la extensión del codo, la muñeca y los dedos. Su daño causa la condición conocida como 'mano caída'.", coords: [{x: 25, y: 40}, {x: 75, y: 40}] },

                    { id: "vejiga", nombre: "Vejiga Urinaria", info: "Órgano elástico que almacena la orina. Puede estirarse para contener hasta medio litro de líquido cómodamente.", coords: [{x: 50, y: 55}] }

        function limpiarMarcadores() {
            const marcadores = document.querySelectorAll('.marcador-dinamico');
            marcadores.forEach(m => m.remove());
        }

        function animarPanelInfo() {
            const panel = document.getElementById("panel-info");
            panel.classList.remove('animar-entrada');
            void panel.offsetWidth; 
            panel.classList.add('animar-entrada');
        }

        function actualizarSistema() {
            const sistemaId = document.getElementById("select-sistema").value;
            const contenedorImg = document.getElementById("contenedor-img-zona");
            const imgZona = document.getElementById("img-zona");
            const contenedorSubpartes = document.getElementById("contenedor-subpartes");
            const selectSubparte = document.getElementById("select-subparte");
            const panelInfo = document.getElementById("panel-info");

            selectSubparte.innerHTML = '<option value="">-- Selecciona una parte anatómica --</option>';
            limpiarMarcadores(); 

            if (sistemaId === "") {
                contenedorImg.style.display = "none";
                contenedorSubpartes.style.display = "none";
                panelInfo.style.display = "none";
                return;
            }

            const datos = datosSistemas[sistemaId];
            
            imgZona.src = datos.imagen;
            contenedorImg.style.display = "block";

            panelInfo.innerHTML = `<strong>Información General</strong>${datos.infoGeneral}`;
            panelInfo.style.display = "block";
            animarPanelInfo();

            datos.partes.forEach(parte => {
                const opcion = document.createElement("option");
                opcion.value = parte.id;
                opcion.textContent = parte.nombre;
                selectSubparte.appendChild(opcion);
            });

            contenedorSubpartes.style.display = "flex";
        }

        function actualizarInfoSubparte() {
            const sistemaId = document.getElementById("select-sistema").value;
            const subparteId = document.getElementById("select-subparte").value;
            const panelInfo = document.getElementById("panel-info");
            const contenedorImg = document.getElementById("contenedor-img-zona");

            const datos = datosSistemas[sistemaId];

            limpiarMarcadores(); 

            if (subparteId === "") {
                panelInfo.innerHTML = `<strong>Información General</strong>${datos.infoGeneral}`;
                animarPanelInfo();
            } else {
                const parte = datos.partes.find(p => p.id === subparteId);
                panelInfo.innerHTML = `<strong>${parte.nombre}</strong>${parte.info}`;
                animarPanelInfo();
                
                parte.coords.forEach(coord => {
                    const nuevoMarcador = document.createElement('div');
                    nuevoMarcador.className = 'marcador-parte marcador-dinamico';
                    nuevoMarcador.style.left = coord.x + "%";
                    nuevoMarcador.style.top = coord.y + "%";
                    
                    contenedorImg.appendChild(nuevoMarcador);
                });
            }
        }

        /* =========================================
           BORRADOR MÁGICO Y LIENZOS
           ========================================= */

        const configuracionCapas = [
            { id: 'canvas-musculos', src: 'musculos.png' },
            { id: 'canvas-organos', src: 'organos.png' },
            { id: 'canvas-nervioso', src: 'nervioso.png' }
        ];

        let estaBorrando = false;
        let ultimoX = 0;
        let ultimoY = 0;
        let pincelSize = 40; 
        let canvasActivo = null;
        let ctxActivo = null;

        function cargarImagenEnCanvas(idCanvas, rutaImagen) {
            const canvas = document.getElementById(idCanvas);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const escala = Math.min(canvas.width / img.width, canvas.height / img.height);
                const x = (canvas.width / 2) - (img.width / 2) * escala;
                const y = (canvas.height / 2) - (img.height / 2) * escala;
                
                ctx.drawImage(img, x, y, img.width * escala, img.height * escala);
                
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            };

            img.onerror = () => {
                console.error(`No se pudo cargar: ${rutaImagen}. Verifica la ruta.`);
            };

            img.src = rutaImagen;
        }

        function inicializarLienzos() {
            configuracionCapas.forEach(capa => {
                cargarImagenEnCanvas(capa.id, capa.src);
            });
            setTimeout(cambiarCapaActiva, 150); 
        }

        function cambiarCapaActiva() {
            document.querySelectorAll('canvas.capa-anatomia').forEach(c => {
                c.classList.remove('capa-activa');
                c.onmousedown = null;
                c.onmousemove = null;
                c.onmouseup = null;
                c.onmouseout = null;
                c.ontouchstart = null;
                c.ontouchmove = null;
                c.ontouchend = null;
            });

            const radioSeleccionado = document.querySelector('input[name="capaSelect"]:checked');
            if(!radioSeleccionado) return;
            
            const idSeleccionado = radioSeleccionado.value;
            canvasActivo = document.getElementById(idSeleccionado);
            canvasActivo.classList.add('capa-activa');
            ctxActivo = canvasActivo.getContext('2d');

            configurarEventosBorrador(canvasActivo);
        }

        function obtenerCoordenadas(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const clienteX = e.touches ? e.touches[0].clientX : e.clientX;
            const clienteY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return {
                x: clienteX - rect.left,
                y: clienteY - rect.top
            };
        }

        function configurarEventosBorrador(canvas) {
            const iniciarBorrado = (e) => {
                estaBorrando = true;
                const pos = obtenerCoordenadas(e, canvas);
                ultimoX = pos.x;
                ultimoY = pos.y;
                borrar(e);
            };

            const detenerBorrado = () => { estaBorrando = false; };

            const borrar = (e) => {
                if (!estaBorrando) return;
                // Prevenir scroll en móviles al arrastrar dentro del canvas
                e.preventDefault(); 

                const pos = obtenerCoordenadas(e, canvas);
                
                ctxActivo.shadowBlur = 15;
                ctxActivo.shadowColor = "white";
                
                ctxActivo.lineWidth = pincelSize;
                ctxActivo.beginPath();
                ctxActivo.moveTo(ultimoX, ultimoY);
                ctxActivo.lineTo(pos.x, pos.y);
                ctxActivo.stroke(); 

                ultimoX = pos.x;
                ultimoY = pos.y;
            };

            canvas.addEventListener('mousedown', iniciarBorrado);
            canvas.addEventListener('mousemove', borrar);
            canvas.addEventListener('mouseup', detenerBorrado);
            canvas.addEventListener('mouseout', detenerBorrado);

            canvas.addEventListener('touchstart', iniciarBorrado, {passive: false});
            canvas.addEventListener('touchmove', borrar, {passive: false});
            canvas.addEventListener('touchend', detenerBorrado);
        }

        window.onload = () => { inicializarLienzos(); };
        
        // Control de Resize Inteligente para Móviles
        // Evita que al hacer scroll vertical en un móvil (y que la barra de URL desaparezca)
        // se dispare el evento onresize y se borre el progreso del canvas.
        let anchoVentanaPrevio = window.innerWidth;
        window.addEventListener('resize', () => {
            if (window.innerWidth !== anchoVentanaPrevio) {
                anchoVentanaPrevio = window.innerWidth;
                inicializarLienzos();
            }
        });

    </script>
