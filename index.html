<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dominó Pro - Mobile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;700&display=swap');

        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ea;
            --board-dark: #07070a;
            --board-light: #13131c;
            --ivory: #ffffff;
            --ivory-dark: #e0e0e0;
            --pip: #0a0a0c;
            --glass: rgba(10, 10, 15, 0.85);
        }

        body {
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none; /* Evita el "pull to refresh" en móviles */
            font-family: 'Inter', sans-serif;
            background: var(--board-dark);
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Evita zoom accidental con doble toque */
        }

        /* --- MENÚ PRINCIPAL --- */
        #menu-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .case-card {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid var(--neon-cyan);
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        h1 { 
            font-family: 'Cinzel', serif;
            font-size: 2.5rem; 
            color: var(--neon-cyan); 
            letter-spacing: 4px; 
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .config-section {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            align-items: center;
            border-left: 3px solid var(--neon-pink);
        }

        select { 
            background: #000; 
            color: var(--neon-cyan); 
            border: 1px solid var(--neon-cyan); 
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            background: transparent;
            color: var(--neon-cyan); 
            padding: 18px; /* Área táctil más grande para celular */
            border: 2px solid var(--neon-cyan); 
            border-radius: 12px;
            font-weight: 800; 
            font-size: 1.1rem;
            cursor: pointer; 
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
            transition: all 0.2s ease;
        }

        .btn:active {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        .btn-pink {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 234, 0.2), inset 0 0 10px rgba(255, 0, 234, 0.1);
        }
        .btn-pink:active {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 25px var(--neon-pink);
        }

        /* --- MESA DE JUEGO --- */
        #game-ui { 
            display: none; 
            height: 100dvh; /* Dynamic Viewport Height: vital para móviles */
            flex-direction: column; 
        }

        #table {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, var(--board-light) 0%, var(--board-dark) 80%);
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
        }

        /* --- FICHAS --- */
        .tile {
            width: 38px; height: 76px; /* Ligeramente más anchas para tocar mejor */
            background: linear-gradient(145deg, var(--ivory), var(--ivory-dark));
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.6);
            flex-shrink: 0;
            position: relative;
            border: 1px solid rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .tile:active { transform: scale(0.95); }

        .tile.on-board-horizontal { width: 70px; height: 35px; flex-direction: row; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); border: none; }
        .tile.on-board-vertical { width: 35px; height: 70px; flex-direction: column; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); border: none; }
        
        .tile-back {
            width: 12px; height: 20px;
            background: #111;
            border: 1px solid var(--neon-cyan);
            box-shadow: inset 0 0 5px rgba(0, 243, 255, 0.3);
            border-radius: 2px;
            display: inline-block;
            margin: 1px;
        }

        .half { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pip); margin: auto; visibility: hidden; }
        .dot.v { visibility: visible; }
        .line { background: rgba(0,0,0,0.2); margin: auto; }
        .tile:not(.on-board-horizontal) .line { width: 85%; height: 2px; }
        .tile.on-board-horizontal .line { width: 2px; height: 85%; }

        /* --- HUD MÓVIL --- */
        .player-tag {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 12px;
            border-radius: 12px;
            text-align: center;
            min-width: 80px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 5;
            font-size: 11px;
            display: none;
            backdrop-filter: blur(5px);
        }
        .active { 
            border-color: var(--neon-pink); 
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.3);
            transform: scale(1.05); 
        }

        #tag-0 { bottom: 15px; left: 50%; transform: translateX(-50%); }
        #tag-1 { left: 10px; top: 35%; transform: translateY(-50%); }
        #tag-2 { top: 15px; left: 50%; transform: translateX(-50%); }
        #tag-3 { right: 10px; top: 35%; transform: translateY(-50%); }

        #hand-dock {
            height: 120px; /* Dock más alto para celulares */
            background: #050508;
            display: flex; 
            justify-content: flex-start; 
            align-items: center;
            gap: 12px; 
            border-top: 2px solid var(--neon-cyan);
            box-shadow: 0 -5px 20px rgba(0, 243, 255, 0.1);
            padding: 0 20px;
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; /* Desplazamiento suave nativo */
        }

        #boneyard {
            position: absolute; right: 15px; bottom: 15px;
            width: 65px; height: 80px;
            background: #0a0a0f; 
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
            cursor: pointer;
        }

        #boneyard:active { background: #1a1a2e; }

        .status-msg {
            position: absolute; top: 90px; color: var(--neon-pink);
            font-family: 'Cinzel', serif; font-size: 1.1rem;
            text-align: center; width: 100%; z-index: 10;
            text-shadow: 0 0 10px rgba(255, 0, 234, 0.5);
            pointer-events: none;
        }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; text-align: center;
            backdrop-filter: blur(10px);
        }

        #viewport-fix { 
            position:absolute; inset:0; 
            display:flex; align-items:center; justify-content:center; 
            transition: 0.5s ease-out; z-index: 10;
        }
        
        #tile-chain { display: flex; align-items: center; gap: 4px; padding: 50px; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="case-card">
        <h1>Dominó</h1>
        <div class="config-section">
            <label style="color: var(--neon-cyan); font-weight: bold; font-size: 14px; letter-spacing: 1px;">MODO DE JUEGO:</label>
            <select id="player-count" onchange="updatePlayerConfigList()" style="margin-top: 10px; width: 100%;">
                <option value="2">Duelo (2P)</option>
                <option value="3">Trío (3P)</option>
                <option value="4" selected>Cuarteto (4P)</option>
            </select>
        </div>
        <div id="config-list"></div>
        <button class="btn" style="margin-top:20px" onclick="startGame()">INICIAR PARTIDA</button>
    </div>
</div>

<div id="choice-overlay" class="overlay">
    <h2 style="color: var(--neon-cyan); font-family: 'Cinzel'; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);">ELEGIR EXTREMO</h2>
    <div style="display:flex; gap:20px; margin-top:30px; width:100%; max-width: 320px;">
        <button class="btn" onclick="game.resolveChoice('left')">IZQUIERDA</button>
        <button class="btn" onclick="game.resolveChoice('right')">DERECHA</button>
    </div>
</div>

<div id="privacy" class="overlay">
    <h2 id="privacy-name" style="color: var(--neon-pink); font-family: 'Cinzel'; font-size: 2rem; text-shadow: 0 0 15px rgba(255, 0, 234, 0.5);"></h2>
    <p style="font-size: 1.2rem; letter-spacing: 2px; color: #aaa; margin-bottom: 40px;">ES TU TURNO</p>
    <button class="btn btn-pink" style="max-width: 250px;" onclick="game.showHand()">VER MIS FICHAS</button>
</div>

<div id="win-overlay" class="overlay">
    <h1 id="winner-text" style="color: var(--neon-cyan); font-family: 'Cinzel'; font-size: 2.5rem; text-shadow: 0 0 20px rgba(0, 243, 255, 0.6);"></h1>
    <p id="win-reason" style="margin-bottom: 40px; font-size: 1.2rem; color: #ddd;"></p>
    <div style="display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 280px;">
        <button class="btn" onclick="restartCurrentGame()">JUGAR REVANCHA</button>
        <button class="btn btn-pink" onclick="backToMenu()">VOLVER AL MENÚ</button>
    </div>
</div>

<div id="game-ui">
    <div id="table">
        <div id="tag-0" class="player-tag"></div>
        <div id="tag-1" class="player-tag"></div>
        <div id="tag-2" class="player-tag"></div>
        <div id="tag-3" class="player-tag"></div>

        <div id="boneyard" onclick="game.drawTileClick()">
            <div id="bone-count" style="font-size: 24px; font-weight: bold; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.5);">0</div>
            <div style="font-size:10px; letter-spacing: 2px; color: #888;">POZO</div>
        </div>

        <div id="viewport-fix">
            <div id="tile-chain"></div>
        </div>
        
        <div id="game-msg" class="status-msg"></div>
    </div>
    <div id="hand-dock"></div>
</div>

<script>
// El motor lógico permanece exactamente igual, solo adaptado a la nueva interfaz gráfica
const PIPS = { 0:[], 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };

class Bone {
    constructor(a, b) {
        this.a = a; this.b = b;
        this.isDouble = (a === b);
        this.id = Math.random();
        this.points = a + b;
    }
    render(location = 'hand', invert = false) {
        const t = document.createElement('div');
        t.className = `tile ${location === 'board' ? (this.isDouble ? 'on-board-vertical' : 'on-board-horizontal') : ''}`;
        
        const side = (n) => {
            const h = document.createElement('div'); h.className = 'half';
            for (let i = 0; i < 9; i++) {
                const d = document.createElement('div');
                d.className = `dot ${PIPS[n].includes(i) ? 'v' : ''}`;
                h.appendChild(d);
            }
            return h;
        };
        
        const v1 = invert ? this.b : this.a;
        const v2 = invert ? this.a : this.b;
        
        t.appendChild(side(v1));
        const l = document.createElement('div'); l.className = 'line'; t.appendChild(l);
        t.appendChild(side(v2));
        
        if (location === 'hand') t.onclick = () => game.selectMove(this);
        return t;
    }
}

class Domino {
    constructor(players) {
        this.players = players;
        this.chain = [];
        this.pool = [];
        this.turn = 0;
        this.consecutivePasses = 0;
        this.mustDraw = false;
        this.init();
    }

    init() {
        for (let i = 0; i <= 6; i++) {
            for (let j = i; j <= 6; j++) this.pool.push(new Bone(i, j));
        }
        this.pool.sort(() => Math.random() - 0.5);
        this.players.forEach(p => p.hand = this.pool.splice(0, 7));

        let starterIdx = -1, highestDouble = -1;
        for(let i=6; i>=0; i--) {
            starterIdx = this.players.findIndex(p => p.hand.some(b => b.a === i && b.b === i));
            if(starterIdx !== -1) { highestDouble = i; break; }
        }

        if (starterIdx !== -1) {
            const mula = this.players[starterIdx].hand.find(b => b.a === highestDouble && b.b === highestDouble);
            this.chain.push({ bone: mula, left: highestDouble, right: highestDouble, inv: false });
            this.players[starterIdx].hand = this.players[starterIdx].hand.filter(b => b !== mula);
            this.turn = (starterIdx + 1) % this.players.length;
        } else {
            this.turn = 0; 
        }
        this.startTurn();
    }

    startTurn() {
        this.updateUI();
        const p = this.players[this.turn];
        const canPlay = p.hand.some(b => this.getMoves(b).length > 0);
        
        if (!canPlay && this.pool.length > 0) {
            this.mustDraw = true;
            this.setMessage(`${p.name} debe robar`);
        } else if (!canPlay && this.pool.length === 0) {
            this.mustDraw = false;
            this.setMessage(`${p.name} no tiene jugada`);
            if (p.ai) {
                setTimeout(() => this.passTurn(), 1000);
                return;
            }
        } else {
            this.mustDraw = false;
            this.setMessage(`Turno de ${p.name}`);
        }

        if (p.ai) {
            document.getElementById('privacy').style.display = 'none';
            if (this.mustDraw) {
                setTimeout(() => this.aiLogic(), 1000);
            } else if (canPlay) {
                setTimeout(() => this.aiLogic(), 1200);
            }
        } else {
            const multiHuman = this.players.filter(pl => !pl.ai).length > 1;
            if (multiHuman) { 
                document.getElementById('privacy').style.display = 'flex';
                document.getElementById('privacy-name').innerText = p.name;
            } else {
                this.renderDock();
            }
        }
    }

    setMessage(txt) { document.getElementById('game-msg').innerText = txt; }
    showHand() { document.getElementById('privacy').style.display = 'none'; this.renderDock(); }

    renderDock() {
        const dock = document.getElementById('hand-dock');
        dock.innerHTML = '';
        this.players[this.turn].hand.forEach(b => dock.appendChild(b.render('hand')));
        
        if (!this.players[this.turn].hand.some(b => this.getMoves(b).length > 0) && this.pool.length === 0) {
            const btn = document.createElement('button');
            btn.className = 'btn btn-pink'; 
            btn.style.width = '120px'; btn.style.minWidth = '120px'; btn.innerText = 'PASAR';
            btn.onclick = () => this.passTurn();
            dock.appendChild(btn);
        }
    }

    updateUI() {
        document.getElementById('bone-count').innerText = this.pool.length;
        
        for (let idx = 0; idx < 4; idx++) {
            document.getElementById(`tag-${idx}`).style.display = 'none';
        }

        this.players.forEach((p, i) => {
            let tagIdx = i;
            if(this.players.length === 2 && i === 1) tagIdx = 2; 
            const tag = document.getElementById(`tag-${tagIdx}`);
            tag.style.display = 'block';
            tag.className = `player-tag ${i === this.turn ? 'active' : ''}`;
            let miniHand = '<div style="display:flex; justify-content:center; gap:2px; margin-top:6px">';
            for(let f=0; f<p.hand.length; f++) miniHand += '<div class="tile-back"></div>';
            miniHand += '</div>';
            
            // Highlight name color based on current turn
            const nameColor = i === this.turn ? 'var(--neon-pink)' : 'var(--neon-cyan)';
            tag.innerHTML = `<b style="color:${nameColor}; letter-spacing:1px;">${p.name}</b>${miniHand}`;
        });

        const chainDiv = document.getElementById('tile-chain');
        chainDiv.innerHTML = '';
        this.chain.forEach(node => chainDiv.appendChild(node.bone.render('board', node.inv)));

        const vFix = document.getElementById('viewport-fix');
        const table = document.getElementById('table');
        vFix.style.transform = 'scale(1)'; 
        const rect = chainDiv.getBoundingClientRect();
        
        const scale = Math.min(1, (table.offsetWidth - 80) / rect.width, (table.offsetHeight - 120) / rect.height);
        vFix.style.transform = `scale(${scale})`;
    }

    getMoves(bone) {
        if (this.chain.length === 0) {
            return [{ bone, left: bone.a, right: bone.b, side: 'right', inv: false }];
        }
        
        const moves = [];
        const L = this.chain[0].left;
        const R = this.chain[this.chain.length - 1].right;
        
        if (bone.a === R) moves.push({ bone, left: bone.a, right: bone.b, side: 'right', inv: false });
        else if (bone.b === R) moves.push({ bone, left: bone.b, right: bone.a, side: 'right', inv: true });
        
        if (bone.b === L) moves.push({ bone, left: bone.a, right: bone.b, side: 'left', inv: false });
        else if (bone.a === L) moves.push({ bone, left: bone.b, right: bone.a, side: 'left', inv: true });
        
        return moves;
    }

    selectMove(bone) {
        if (this.mustDraw || this.players[this.turn].ai) return;
        const moves = this.getMoves(bone);
        if (moves.length === 0) return;
        if (moves.length === 1) this.playMove(moves[0]);
        else { this.pendingMoves = moves; document.getElementById('choice-overlay').style.display = 'flex'; }
    }

    resolveChoice(side) {
        const move = this.pendingMoves.find(m => m.side === side);
        document.getElementById('choice-overlay').style.display = 'none';
        this.playMove(move);
    }

    playMove(move) {
        if (move.side === 'right') this.chain.push(move); else this.chain.unshift(move);
        this.players[this.turn].hand = this.players[this.turn].hand.filter(b => b.id !== move.bone.id);
        this.consecutivePasses = 0;

        if (this.players[this.turn].hand.length === 0) {
            this.endGame(this.players[this.turn].name, "¡HA DOMINADO LA MESA!");
            return;
        }
        this.turn = (this.turn + 1) % this.players.length;
        this.startTurn();
    }

    drawTileClick() { 
        if (this.mustDraw && !this.players[this.turn].ai) {
            this.performDraw(); 
        }
    }

    performDraw() {
        if (this.pool.length > 0) {
            const b = this.pool.pop();
            this.players[this.turn].hand.push(b);
            
            const moves = this.getMoves(b);
            if (moves.length > 0) { 
                this.mustDraw = false; 
            } else if (this.pool.length === 0) {
                this.mustDraw = false;
            }
            this.updateUI();
            
            if (!this.players[this.turn].ai) {
                this.renderDock(); 
            }
            
            return moves.length > 0 ? moves[0] : null;
        } else {
            this.mustDraw = false;
            this.updateUI();
            
            if (!this.players[this.turn].ai) {
                this.renderDock(); 
            }
            return null;
        }
    }

    aiLogic() {
        const p = this.players[this.turn];
        
        if (this.mustDraw && this.pool.length > 0) {
            const forcedMove = this.performDraw();
            if (forcedMove) {
                setTimeout(() => this.playMove(forcedMove), 800);
            } else {
                setTimeout(() => this.startTurn(), 600);
            }
            return;
        }

        const playable = p.hand.find(b => this.getMoves(b).length > 0);
        if (playable) {
            this.playMove(this.getMoves(playable)[0]);
        } else {
            this.passTurn();
        }
    }

    passTurn() {
        this.consecutivePasses++;
        if (this.consecutivePasses >= this.players.length) { this.handleTranque(); return; }
        this.turn = (this.turn + 1) % this.players.length;
        this.startTurn();
    }

    handleTranque() {
        let minPoints = Infinity;
        let winners = [];
        
        this.players.forEach(p => {
            const total = p.hand.reduce((sum, b) => sum + b.points, 0);
            if (total < minPoints) { 
                minPoints = total; 
                winners = [p]; 
            } else if (total === minPoints) {
                winners.push(p);
            }
        });
        
        const winNames = winners.map(w => w.name).join(" Y ");
        this.endGame(winNames, `¡JUEGO TRANCADO! VICTORIA POR PUNTOS (${minPoints} PTS)`);
    }

    endGame(name, reason) {
        this.updateUI();
        document.getElementById('winner-text').innerText = name;
        document.getElementById('win-reason').innerText = reason;
        document.getElementById('win-overlay').style.display = 'flex';
    }
}

let game;
let currentConfig = [];

function updatePlayerConfigList() {
    const count = parseInt(document.getElementById('player-count').value);
    const list = document.getElementById('config-list');
    list.innerHTML = '';
    for (let i = 0; i < count; i++) {
        list.innerHTML += `
            <div class="player-row">
                <span style="font-size:0.9rem; font-weight:bold; color:var(--ivory-dark)">POSICIÓN ${i + 1}</span>
                <select id="sel-${i}">
                    <option value="human">HUMANO</option>
                    <option value="ai" ${i > 0 ? 'selected' : ''}>🤖 IA</option>
                </select>
            </div>`;
    }
}

function startGame() {
    const count = parseInt(document.getElementById('player-count').value);
    currentConfig = [];
    for (let i = 0; i < count; i++) {
        currentConfig.push({
            name: `JUGADOR ${i + 1}`,
            ai: document.getElementById(`sel-${i}`).value === 'ai',
            hand: []
        });
    }
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('game-ui').style.display = 'flex';
    game = new Domino(JSON.parse(JSON.stringify(currentConfig)));
}

function restartCurrentGame() {
    document.getElementById('win-overlay').style.display = 'none';
    game = new Domino(JSON.parse(JSON.stringify(currentConfig)));
}
